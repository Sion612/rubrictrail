name: Bug report
description: Report a reproducible RubricTrail problem without sharing private coursework.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real student work, credentials, or private documents.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use fictional or redacted input.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy check
      options:
        - label: I removed coursework, personal data and secrets from this report.
          required: true
