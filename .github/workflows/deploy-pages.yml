name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: pages-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: false
  queue: max

jobs:
  freshness:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      verified_sha: ${{ steps.freshness.outputs.verified_sha }}
    steps:
      - name: Check out the triggering verified revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Check whether a newer successful main CI supersedes this run
        id: freshness
        env:
          EXPECTED_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          EXPECTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deployment-freshness.mjs check

  build:
    needs: freshness
    if: needs.freshness.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PAGES_BASE_PATH: /rubrictrail
    steps:
      - name: Check out the exact verified revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.freshness.outputs.verified_sha }}
          persist-credentials: false
      - name: Verify the checked out revision
        env:
          VERIFIED_SHA: ${{ needs.freshness.outputs.verified_sha }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the static demo
        run: pnpm build:demo
      - name: Write the verified deployment marker
        env:
          VERIFIED_SHA: ${{ needs.freshness.outputs.verified_sha }}
        run: node scripts/deployment-freshness.mjs marker
      - name: Audit the static demo boundary
        run: pnpm audit:demo
      - name: Preserve GitHub Pages dotfiles
        run: touch demo/out/.nojekyll
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo/out
          include-hidden-files: true

  deploy:
    needs: [freshness, build]
    if: needs.freshness.outputs.should_deploy == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke:
    needs: [freshness, deploy]
    if: needs.freshness.outputs.should_deploy == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the exact deployed revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.freshness.outputs.verified_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Verify the public Pages deployment
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          VERIFIED_SHA: ${{ needs.freshness.outputs.verified_sha }}
        run: node scripts/smoke-pages.mjs
