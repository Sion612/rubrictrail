allowBuilds:
  sharp: true
  # Tesseract's postinstall only prints an OpenCollective message; RubricTrail
  # does not need or permit that dependency script during installation.
  tesseract.js: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.25.0
  - openai@6.48.0
overrides:
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  js-yaml@4: 4.3.1
  nanoid@3: 3.3.18
  undici@7: 7.29.0
